name: Skill workshop Windows gate
on:
  push:
    branches: [codex/skill-workshop-public-20260927]
  pull_request:
    paths: ["skill-workshop/**", "standard/standard-skill-workshop.js", "scripts/build-skill-workshop.mjs", "tests/standard-skill-workshop*.test.cjs", ".github/workflows/skill-workshop-windows.yml"]
permissions:
  contents: read
jobs:
  workshop:
    runs-on: windows-2025
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, edge]
    env:
      STANDARD_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Install browser test dependency without install scripts
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.62.1
      - name: Check isolated generated bundle
        run: node scripts/build-skill-workshop.mjs --check
      - name: Workshop rules and ordinary core regressions
        run: node --test --test-concurrency=1 tests/standard-skill-workshop.test.cjs tests/standard-match.test.cjs tests/standard-skill-dispatcher.test.cjs tests/standard-skill-catalog.test.cjs
      - name: Real browser trial controls, persistence, and profile isolation
        run: node --test --test-concurrency=1 tests/standard-skill-workshop-browser.test.cjs
