name: Standard browser gate

on:
  push:
    branches: [codex/standard-release-command, codex/quiz-memo-calculator-20260912, codex/ui-diet-20260912, codex/ui-play-surface-20260912, codex/ui-result-20260912, codex/ui-cosmetics-20260912, codex/ui-player-copy-20260912]
    paths:
      - .github/workflows/standard-browser-gate.yml
      - online/supabase-config.js
      - online-v5/style.css
      - docs/STANDARD_PUBLIC_RELEASE_RUNBOOK.md
      - docs/PROJECT_COMMAND_CENTER.md
      - standard-online-v5/**
      - standard-v5/**
      - standard/**
      - scripts/build-standard-online-engine.mjs
      - scripts/build-standard-online-skill-registry.mjs
      - scripts/build-standard-v5-bundle.mjs
      - scripts/check-standard-decision-reconciliation.mjs
      - scripts/standard-cpu-selfplay.cjs
      - scripts/live-standard-*.mjs
      - supabase/functions/standard-game-action/**
      - supabase/migrations/**
      - supabase/verification/**
      - tests/standard-*.test.cjs
      - tests/standard-browser-gate-workflow.test.cjs
      - tests/standard-cpu-browser.test.cjs
      - tests/standard-edge-handler.test.cjs
      - tests/standard-kurogane-lookahead.test.cjs
      - tests/standard-kurogane-policy-migration.test.cjs
      - tests/standard-online-engine-bundle.test.cjs
      - tests/standard-online-browser.test.cjs
      - tests/browser-server-cleanup.test.cjs
      - tests/helpers/browser-server-cleanup.cjs
  pull_request:
    paths:
      - .github/workflows/standard-browser-gate.yml
      - online/supabase-config.js
      - online-v5/style.css
      - docs/STANDARD_PUBLIC_RELEASE_RUNBOOK.md
      - docs/PROJECT_COMMAND_CENTER.md
      - standard-online-v5/**
      - standard-v5/**
      - standard/**
      - scripts/build-standard-online-engine.mjs
      - scripts/build-standard-online-skill-registry.mjs
      - scripts/build-standard-v5-bundle.mjs
      - scripts/check-standard-decision-reconciliation.mjs
      - scripts/standard-cpu-selfplay.cjs
      - scripts/live-standard-*.mjs
      - supabase/functions/standard-game-action/**
      - supabase/migrations/**
      - supabase/verification/**
      - tests/standard-*.test.cjs
      - tests/standard-browser-gate-workflow.test.cjs
      - tests/standard-cpu-browser.test.cjs
      - tests/standard-edge-handler.test.cjs
      - tests/standard-kurogane-lookahead.test.cjs
      - tests/standard-kurogane-policy-migration.test.cjs
      - tests/standard-online-engine-bundle.test.cjs
      - tests/standard-online-browser.test.cjs
      - tests/browser-server-cleanup.test.cjs
      - tests/helpers/browser-server-cleanup.cjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standard-browser-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Standard online browser (${{ matrix.STANDARD_BROWSER }})
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        STANDARD_BROWSER: [chrome, edge]
    env:
      STANDARD_BROWSER: ${{ matrix.STANDARD_BROWSER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install browser test dependency
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.62.1
      - name: Verify generated Standard bundles
        run: |
          node scripts/build-standard-v5-bundle.mjs
          node scripts/build-standard-online-engine.mjs
          node scripts/build-standard-online-skill-registry.mjs
          git diff --exit-code -- standard-v5/app.bundle.js supabase/functions/standard-game-action/standard-engine.bundle.js standard-online-v5/standard-skill-registry.generated.js
      - name: Run Standard CPU policy contract tests
        run: >-
          node --test --test-concurrency=1
          tests/standard-kurogane-lookahead.test.cjs
          tests/standard-kurogane-policy-migration.test.cjs
          tests/standard-edge-handler.test.cjs
          tests/standard-online-engine-bundle.test.cjs
          tests/standard-debug-unlimited.test.cjs
          tests/standard-debug-room-access.test.cjs
          tests/standard-decision-reconciliation.test.cjs
          tests/standard-browser-gate-workflow.test.cjs
          tests/standard-online-browser-harness-static.test.cjs
          tests/browser-server-cleanup.test.cjs
          tests/standard-legal-recolor-lab.test.cjs
          tests/standard-live-legal-recolor-lab-canary-static.test.cjs
          tests/standard-live-color-response-canary-static.test.cjs
          tests/standard-live-release-preflight-static.test.cjs
          tests/standard-candidate-verification-sql.test.cjs
          tests/standard-matchmaking-availability-migration.test.cjs
          tests/standard-public-release-runbook.test.cjs
          tests/standard-setup-revision-guard.test.cjs
          tests/standard-basic-feedback.test.cjs
          tests/standard-online-basic-feedback-static.test.cjs
          tests/standard-online-contact-feedback.test.cjs
          tests/standard-online-micro-bloom-regression.test.cjs
          tests/standard-cpu-commentary.test.cjs
          tests/standard-cpu.test.cjs
          tests/standard-cpu-colored-corner-bloom.test.cjs
          tests/standard-cpu-selfplay.test.cjs
          tests/standard-cpu-roster.test.cjs
          tests/standard-match.test.cjs
          tests/standard-match-start.test.cjs
          tests/standard-match-transaction.test.cjs
          tests/standard-save.test.cjs
          tests/standard-local-session.test.cjs
          tests/standard-skill-dispatcher.test.cjs
          tests/standard-area-corner-bloom.test.cjs
          tests/standard-area-colored-corner-bloom.test.cjs
          tests/standard-area-die-plus.test.cjs
          tests/standard-area-half-shift-invariants.test.cjs
          tests/standard-area-resize.test.cjs
          tests/standard-area-triple-shift.test.cjs
          tests/standard-disrupt-choice-one-invariants.test.cjs
          tests/standard-disrupt-choice-two.test.cjs
          tests/standard-disrupt-choice-three.test.cjs
          tests/standard-disrupt-palette-choice.test.cjs
          tests/standard-disrupt-palette-random.test.cjs
          tests/standard-disrupt-random-one.test.cjs
          tests/standard-disrupt-random-two.test.cjs
          tests/standard-no-color-rescue.test.cjs
          tests/standard-color-region-split.test.cjs
          tests/standard-local-ui-static.test.cjs
          tests/standard-online-client.test.cjs
          tests/standard-online-quiz-generator-runtime.test.cjs
          tests/standard-online-quiz-polish.test.cjs
          tests/standard-quiz-scratch.test.cjs
          tests/standard-online-random-info-ui.test.cjs
          tests/standard-online-skill-registry.test.cjs
          tests/standard-online-skill-intents.test.cjs
          tests/standard-online-ui-static.test.cjs
          tests/standard-play-surface-model.test.cjs
          tests/standard-result-continuation.test.cjs
          tests/standard-cosmetic-item-action.test.cjs
          tests/standard-player-copy-static.test.cjs
          tests/standard-recolor.test.cjs
          tests/standard-cpu-browser.test.cjs
      - name: Run Standard local lifecycle browser tests serially
        if: matrix.STANDARD_BROWSER == 'edge'
        run: >-
          node --test --test-concurrency=1
          tests/standard-color-seal-browser-lifecycle.test.cjs
          tests/standard-no-color-browser-terminal.test.cjs
      - name: Run Standard online browser test serially
        run: >-
          node --test --test-concurrency=1
          tests/standard-basic-feedback-browser.test.cjs
          tests/standard-online-browser.test.cjs
