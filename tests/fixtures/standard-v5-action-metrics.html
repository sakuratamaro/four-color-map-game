<!doctype html>
<meta charset="utf-8">
<title>Standard v5 action metrics browser fixture</title>
<script>
  "use strict";
  // Browser E2E only: instrument product save writes and generated IDs without changing the product bundle.
  const bootstrap = document.createElement("iframe");
  bootstrap.hidden = true;
  bootstrap.src = "/tests/fixtures/standard-v5-browser-bootstrap.html";
  bootstrap.onload = async () => {
    if (bootstrap.contentWindow.location.pathname !== "/standard-v5/") return;
    let productHtml = await fetch("/standard-v5/").then((response) => response.text());
    const metricsHook = `<script>
      (() => {
        const SAVE_KEY = "fourColorMapGame.standard.v5.save";
        const metrics = { saveWrites: 0, generatedIds: 0, saves: [] };
        const publish = () => queueMicrotask(() => {
          const output = document.getElementById("e2eMetrics");
          if (output) output.textContent = JSON.stringify(metrics);
        });
        const originalSetItem = Storage.prototype.setItem;
        Storage.prototype.setItem = function(key, value) {
          if (key === SAVE_KEY) {
            metrics.saveWrites += 1;
            try {
              const root = JSON.parse(value);
              metrics.saves.push({
                rootRevision: root.rootRevision,
                matchVersion: root.activeMatch?.state?.version ?? null,
                hand: root.activeMatch?.state?.hands?.B?.areaHalfShift ?? null,
                actionReceipts: Object.keys(root.receipts?.matchAction || {}).length,
                consumptionReceipts: Object.keys(root.receipts?.matchConsumption || {}).length,
              });
            } catch { metrics.saves.push({ invalid: true }); }
          }
          try { return originalSetItem.call(this, key, value); } finally { publish(); }
        };
        const originalRandomUUID = globalThis.crypto.randomUUID.bind(globalThis.crypto);
        Object.defineProperty(globalThis.crypto, "randomUUID", {
          configurable: true,
          value() { metrics.generatedIds += 1; publish(); return originalRandomUUID(); },
        });
        addEventListener("DOMContentLoaded", () => {
          publish();
          const focusTarget = new URLSearchParams(location.search).get("focus");
          if (focusTarget) document.getElementById(focusTarget)?.focus();
        }, { once: true });
      })();
    <\/script>`;
    const productScript = '<scr' + 'ipt src="app.bundle.js"></scr' + 'ipt>';
    productHtml = productHtml
      .replace('<link rel="stylesheet" href="style.css">', '<link rel="stylesheet" href="/standard-v5/style.css">')
      .replace('<body>', '<body><output id="e2eMetrics" aria-label="E2E metrics" hidden></output>')
      .replace(productScript, `${metricsHook}<script src="/standard-v5/app.bundle.js?action-metrics=4"></scr` + `ipt>`);
    document.open();
    document.write(productHtml);
    document.close();
  };
  document.documentElement.appendChild(bootstrap);
</script>
